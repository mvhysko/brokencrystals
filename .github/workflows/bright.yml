name: Bright

on:
  pull_request:
    branches:
      - '**'

permissions:
  checks: write
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Start Application
        env:
          CHAT_API_MAX_TOKENS: 200
          CHAT_API_MODEL: smollm:135m
          CHAT_API_URL: http://ollama:11434/v1/chat/completions
          GRPC_WEB_PROXY_URL: http://grpcwebproxy:8081
          POSTGRES_DB: bc
          POSTGRES_PASSWORD: bc
          POSTGRES_USER: bc
          URL: http://localhost:3000
        run: |
          docker compose -f compose.local.yml up --wait

      - name: Probe Application Readiness
        run: |
          i=1; while [ "$i" -le 30 ]; do curl -sS -o /dev/null http://127.0.0.1:3000 && exit 0; sleep 5; i=$((i + 1)); done; exit 1

      - name: Install SecTesterJS Dependencies
        run: |
          npm i --save=false --prefix .brightsec @sectester/core@0.49.0 @sectester/repeater@0.49.0 @sectester/scan@0.49.0 @sectester/runner@0.49.0 @sectester/reporter@0.49.0

      - name: Authenticate with Bright
        env:
          BRIGHT_HOSTNAME: app.brightsec.com
          BRIGHT_PROJECT_ID: qpuGABz6fNCMrpjtMiLjfq
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
        run: |
          echo "Requesting OIDC token..."
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .id_token)
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token" >&2
            exit 1
          fi
          echo "Authenticating with BrightSec..."
          BRIGHT_TOKEN=$(curl -s -X POST "https://app.brightsec.com/api/v1/auth/oidc" -H "Content-Type: application/json" -d '{"idToken":"'$ID_TOKEN'","projectId":"'$BRIGHT_PROJECT_ID'"}' | jq -r .token)
          if [ -z "$BRIGHT_TOKEN" ] || [ "$BRIGHT_TOKEN" = "null" ]; then
            echo "Failed to authenticate with BrightSec" >&2
            exit 1
          fi
          echo "BRIGHT_TOKEN=$BRIGHT_TOKEN" >> $GITHUB_ENV

      - name: Run Security Tests
        env:
          BRIGHT_HOSTNAME: app.brightsec.com
          BRIGHT_PROJECT_ID: qpuGABz6fNCMrpjtMiLjfq
          BRIGHT_AUTH_ID: ${{ vars.BRIGHT_AUTH_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ env.BRIGHT_TOKEN }}
          BRIGHT_TARGET_URL: http://127.0.0.1:3000
          SECTESTER_SCAN_POOL_SIZE: ${{ vars.SECTESTER_SCAN_POOL_SIZE }}
        run: |
          node --experimental-transform-types --experimental-strip-types --experimental-detect-module --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --disable-warning=ExperimentalWarning --test-force-exit --test-concurrency=4 --test .brightsec/tests/*.test.ts
