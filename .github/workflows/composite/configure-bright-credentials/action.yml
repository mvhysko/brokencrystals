name: 'Configure Bright Credentials'
description: 'Retrieves OIDC token, exchanges it for a BrightSec pureKey, and exports it as BRIGHT_TOKEN.'
inputs:
  bright_client_id:
    description: 'BrightSec Client ID'
    required: true
  bright_client_secret:
    description: 'BrightSec Client Secret'
    required: true
  bright_audience:
    description: 'BrightSec OIDC Audience'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Retrieve OIDC Token
      id: oidc-token
      shell: bash
      run: |
        echo "::echo::on"
        export OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ inputs.bright_audience }}" | jq -r '.value')
        echo "OIDC_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV
        echo "::add-mask::$OIDC_TOKEN"
    - name: Exchange OIDC Token for Bright pureKey
      id: get-bright-token
      shell: bash
      env:
        BRIGHT_CLIENT_ID: ${{ inputs.bright_client_id }}
        BRIGHT_CLIENT_SECRET: ${{ inputs.bright_client_secret }}
        OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
      run: |
        BRIGHT_RESPONSE=$(curl -s -X POST https://auth.brightsec.com/oidc/token \
          -H "Content-Type: application/json" \
          -d '{"clientId":"'$BRIGHT_CLIENT_ID'","clientSecret":"'$BRIGHT_CLIENT_SECRET'","oidcToken":"'$OIDC_TOKEN'"}')
        PURE_KEY=$(echo "$BRIGHT_RESPONSE" | jq -r '.pureKey')
        if [ -z "$PURE_KEY" ] || [ "$PURE_KEY" == "null" ]; then
          echo "Failed to retrieve pureKey from BrightSec response: $BRIGHT_RESPONSE" >&2
          exit 1
        fi
        echo "BRIGHT_TOKEN=$PURE_KEY" >> $GITHUB_ENV
        echo "bright_token=$PURE_KEY" >> $GITHUB_OUTPUT
        echo "::add-mask::$PURE_KEY"
outputs:
  bright_token:
    description: 'The BrightSec pureKey token.'
    value: ${{ steps.get-bright-token.outputs.bright_token }}
