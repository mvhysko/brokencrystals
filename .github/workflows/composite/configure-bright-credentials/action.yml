name: 'Configure Bright Credentials'
description: 'Obtain OIDC token and exchange for BrightSec API token.'
runs:
  using: 'composite'
  steps:
    - name: Get OIDC Token
      id: oidc-token
      uses: actions/github-script@v6
      with:
        script: |
          const token = await core.getIDToken();
          core.setOutput('oidc_token', token);

    - name: Exchange OIDC Token for BrightSec API Token
      id: bright-auth
      shell: bash
      run: |
        if [ -z "${{ steps.oidc-token.outputs.oidc_token }}" ]; then
          echo "OIDC token is empty" >&2
          exit 1
        fi
        response=$(curl -s -X POST "https://auth.brightsec.com/oidc/token" \
          -H "Content-Type: application/json" \
          -d '{"token": "${{ steps.oidc-token.outputs.oidc_token }}"}')
        echo "$response" | jq .
        api_token=$(echo "$response" | jq -r '.access_token')
        if [ "$api_token" == "null" ] || [ -z "$api_token" ]; then
          echo "Failed to obtain BrightSec API token" >&2
          exit 1
        fi
        echo "::add-mask::$api_token"
        echo "api_token=$api_token" >> $GITHUB_OUTPUT
outputs:
  api_token:
    description: 'BrightSec API token'
    value: ${{ steps.bright-auth.outputs.api_token }}
